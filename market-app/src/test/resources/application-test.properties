# Test Configuration for Market App

# Database - H2 для тестов
spring.r2dbc.url=r2dbc:h2:mem:///testdb?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Redis - используем embedded redis для тестов
spring.data.redis.host=localhost
spring.data.redis.port=6370

# OAuth2 Client - тестовая конфигурация
spring.security.oauth2.client.registration.market-app-client.client-id=test-client
spring.security.oauth2.client.registration.market-app-client.client-secret=test-secret
spring.security.oauth2.client.registration.market-app-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.market-app-client.scope=read,write

spring.security.oauth2.client.provider.market-app-client.token-uri=http://localhost:9000/oauth2/token

# Payment Service
payment.service.url=http://localhost:8081
payment.service.timeout=5000

# Logging
logging.level.ru.mirakyan.mymarket=DEBUG
logging.level.org.springframework.security=DEBUG

