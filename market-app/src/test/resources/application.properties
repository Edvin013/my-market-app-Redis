spring.application.name=my-market-app-test
spring.profiles.active=test

spring.r2dbc.url=r2dbc:h2:mem:///testdb?options=DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Redis Configuration for tests (embedded Redis)
spring.data.redis.host=localhost
spring.data.redis.port=6370
spring.data.redis.timeout=2000ms

# Cache Configuration
cache.item.ttl=60

# Payment Service Configuration for tests
payment.service.url=http://localhost:8081
payment.service.timeout=5000

# Logging for tests
logging.level.ru.mirakyan.mymarket=INFO
logging.level.org.springframework.web=WARN
logging.level.io.r2dbc=WARN
